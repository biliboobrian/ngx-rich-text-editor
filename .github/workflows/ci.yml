name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install
      - run: npm run build
      - run: npm run build:demo
      - name: Pack library
        run: npm pack --pack-destination ../.. && mv ../../*.tgz ../../lib.tgz
        working-directory: dist/ngx-rich-text-editor
      - uses: actions/upload-artifact@v6
        with:
          name: lib
          path: lib.tgz

  compat:
    name: Angular ${{ matrix.angular }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        angular: ['19', '20', 'latest']
    env:
      NG_CLI_ANALYTICS: 'false'
    defaults:
      run:
        working-directory: compat
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/download-artifact@v7
        with:
          name: lib
          path: compat
      - name: Install Angular ${{ matrix.angular }} + packed library
        run: |
          V=${{ matrix.angular }}
          npm install --no-audit --no-fund \
            @angular/core@$V @angular/common@$V @angular/compiler@$V @angular/forms@$V \
            @angular/platform-browser@$V @angular/build@$V @angular/cli@$V @angular/compiler-cli@$V \
            rxjs tslib zone.js playwright ./lib.tgz
          npx ng version
      - run: npx ng build
      - run: npx playwright install --with-deps chromium
      - name: Browser smoke test
        run: |
          python3 -m http.server 4300 --directory dist/browser &
          sleep 2
          node smoke.mjs http://localhost:4300
