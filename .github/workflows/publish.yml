name: Publish to npm

# Push a version tag to publish:  git tag v0.1.0 && git push origin v0.1.0
# The tag must match the version in projects/ngx-rich-text-editor/package.json.
# Requires a repository secret NPM_TOKEN (npm granular access token).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check tag matches package version
        if: github.ref_type == 'tag'
        run: |
          PKG=$(node -p "require('./projects/ngx-rich-text-editor/package.json').version")
          [ "v$PKG" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} != package version v$PKG"; exit 1; }
      - run: npm install
      - run: npm run build
      - run: npm publish --access public --provenance
        working-directory: dist/ngx-rich-text-editor
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
