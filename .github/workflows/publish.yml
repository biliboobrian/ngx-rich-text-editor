name: Publish to npm

# Create a GitHub release (e.g. tag v0.1.0) to publish.
# Requires a repository secret NPM_TOKEN (npm "Automation" token).
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install
      - run: npm run build
      - run: npm publish --access public --provenance
        working-directory: dist/ngx-rich-text-editor
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
