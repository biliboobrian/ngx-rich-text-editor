<div
  class="nrte"
  [class.nrte--focused]="focused()"
  [class.nrte--disabled]="isDisabled()"
  [class.nrte--source]="sourceMode()"
>
  @if (!hideToolbar()) {
    <div class="nrte__toolbar" role="toolbar" aria-label="Formatting">
      @for (item of toolbar(); track $index) {
        @if (item === '|') {
          <span class="nrte__sep" aria-hidden="true"></span>
        } @else {
          <button
            type="button"
            class="nrte__btn"
            [class.nrte__btn--active]="isActive(item)"
            [attr.aria-pressed]="isToggle(item) ? isActive(item) : null"
            [attr.aria-label]="titleOf(item)"
            [title]="titleOf(item)"
            [disabled]="isDisabled() || (sourceMode() && item !== 'source')"
            (mousedown)="$event.preventDefault()"
            (click)="execute(asCommand(item))"
          >
            @switch (item) {
              @case ('bold') { <b class="nrte__txt">B</b> }
              @case ('italic') { <i class="nrte__txt nrte__txt--serif">I</i> }
              @case ('underline') { <u class="nrte__txt">U</u> }
              @case ('strikeThrough') { <s class="nrte__txt">S</s> }
              @case ('subscript') { <span class="nrte__txt">X<sub>2</sub></span> }
              @case ('superscript') { <span class="nrte__txt">X<sup>2</sup></span> }
              @case ('paragraph') { <span class="nrte__txt">¶</span> }
              @case ('h1') { <span class="nrte__txt nrte__txt--sm">H1</span> }
              @case ('h2') { <span class="nrte__txt nrte__txt--sm">H2</span> }
              @case ('h3') { <span class="nrte__txt nrte__txt--sm">H3</span> }
              @case ('clear') { <span class="nrte__txt nrte__txt--sm">T<sub>x</sub></span> }
              @default {
                <svg class="nrte__icon" viewBox="0 0 24 24" aria-hidden="true">
                  @switch (item) {
                    @case ('undo') { <svg:polyline points="9 14 4 9 9 4" /><svg:path d="M20 20v-7a4 4 0 0 0-4-4H4" /> }
                    @case ('redo') { <svg:polyline points="15 14 20 9 15 4" /><svg:path d="M4 20v-7a4 4 0 0 1 4-4h12" /> }
                    @case ('unorderedList') {
                      <svg:path d="M9 6h11M9 12h11M9 18h11" />
                      <svg:circle cx="4.5" cy="6" r="1" class="nrte__fill" /><svg:circle cx="4.5" cy="12" r="1" class="nrte__fill" /><svg:circle cx="4.5" cy="18" r="1" class="nrte__fill" />
                    }
                    @case ('orderedList') { <svg:path d="M10 6h10M10 12h10M10 18h10M4 4h1v4M3.5 8h2.5M3.5 11.5h2.5L3.5 15h2.5M3.5 17.5h2.5v3h-2.5M4 19h2" /> }
                    @case ('indent') { <svg:path d="M11 6h9M11 12h9M11 18h9M4 8l3 2.5L4 13" /> }
                    @case ('outdent') { <svg:path d="M11 6h9M11 12h9M11 18h9M7 8l-3 2.5L7 13" /> }
                    @case ('blockquote') { <svg:path d="M7 7H4v5h3l-1.5 5M17 7h-3v5h3l-1.5 5" /> }
                    @case ('code') { <svg:polyline points="16 18 22 12 16 6" /><svg:polyline points="8 6 2 12 8 18" /> }
                    @case ('alignLeft') { <svg:path d="M4 6h16M4 10h10M4 14h16M4 18h10" /> }
                    @case ('alignCenter') { <svg:path d="M4 6h16M7 10h10M4 14h16M7 18h10" /> }
                    @case ('alignRight') { <svg:path d="M4 6h16M10 10h10M4 14h16M10 18h10" /> }
                    @case ('alignJustify') { <svg:path d="M4 6h16M4 10h16M4 14h16M4 18h16" /> }
                    @case ('link') {
                      <svg:path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
                      <svg:path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
                    }
                    @case ('unlink') {
                      <svg:path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
                      <svg:path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
                      <svg:path d="M3 3l18 18" />
                    }
                    @case ('image') {
                      <svg:rect x="3" y="3" width="18" height="18" rx="2" />
                      <svg:circle cx="8.5" cy="8.5" r="1.5" />
                      <svg:polyline points="21 15 16 10 5 21" />
                    }
                    @case ('horizontalRule') { <svg:path d="M3 12h18" /> }
                    @case ('source') { <svg:path d="M9 8l-4 4 4 4M15 8l4 4-4 4M13 6l-2 12" /> }
                  }
                </svg>
              }
            }
          </button>
        }
      }
    </div>
  }

  <div
    #editable
    class="nrte__content"
    [class.nrte__content--empty]="isEmpty()"
    [class.nrte__hidden]="sourceMode()"
    [attr.contenteditable]="isDisabled() ? 'false' : 'true'"
    [attr.data-placeholder]="placeholder()"
    [attr.aria-label]="ariaLabel()"
    [attr.aria-disabled]="isDisabled()"
    [style.min-height]="minHeight()"
    [style.max-height]="maxHeight()"
    role="textbox"
    aria-multiline="true"
    spellcheck="true"
    (input)="onInput()"
    (paste)="onPaste($event)"
    (focus)="onFocus()"
    (blur)="onBlur()"
    (keydown)="onKeydown($event)"
  ></div>

  @if (sourceMode()) {
    <textarea
      #sourceArea
      class="nrte__source"
      spellcheck="false"
      aria-label="HTML"
      [style.min-height]="minHeight()"
      [style.max-height]="maxHeight()"
      (input)="onSourceInput($event)"
      (blur)="onBlur()"
    ></textarea>
  }
</div>
